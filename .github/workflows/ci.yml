name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (unit + E2E + mutation + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        run: |
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Install Chromium system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium

      # ✅ تشغيل Vitest مع --config صراحةً
      - name: Unit tests + coverage (Vitest)
        run: npx vitest run --config vitest.config.js --coverage

      - name: Mutation tests (Stryker)
        run: npx stryker run

      # ✅ تشغيل Playwright مع --config صراحةً
      - name: E2E tests (Playwright)
        run: npx playwright test --config playwright.config.js

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      # ✅ إنشاء المجلدات قبل رفعها
      - name: Ensure report directories exist
        if: always()
        run: |
          mkdir -p coverage/node
          mkdir -p reports/mutation
          mkdir -p test-results

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node
          path: coverage/node/
          retention-days: 14

      - name: Upload Stryker mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7