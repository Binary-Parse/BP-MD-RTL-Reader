name: Scorecard supply-chain security

# OpenSSF Scorecard assesses THIS repo's own security posture (pinned actions,
# branch protection, code review, token permissions, etc.) — complementary to
# the SAST/secret/dependency gates and free, with no GHAS requirement.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # OIDC token for publish_results
      contents: read
      actions: read
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results requires a PUBLIC repo (it pushes to the public OpenSSF
          # API and hard-fails otherwise). The SARIF upload below is the real
          # security signal and works on public OR private. Flip to true (and keep
          # the id-token: write permission above) once this repo is public.
          publish_results: false
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: results.sarif
